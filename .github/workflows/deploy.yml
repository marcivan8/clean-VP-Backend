name: Deploy

on:
  push:
    branches:
      - main      # → production
      - staging   # → staging

# Only one deploy per environment at a time.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Wait for CI to pass before deploying ──────────────────────────────────
  # We reuse the same lint/build/test steps rather than waiting on the
  # separate CI workflow, so this job is self-contained and always runs
  # the checks before touching Railway.
  build-and-deploy:
    name: Build → Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    # GitHub Actions does not allow the `secrets` context inside an `if:`
    # condition — `if:` is evaluated before secrets are resolved for the run,
    # so `secrets.X` there fails with "Unrecognized named-value: 'secrets'".
    # Route it through a job-level env var instead; env IS available to
    # step-level `if:` conditions.
    env:
      SENTRY_AUTH_TOKEN_SET: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # ── Node setup ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # ── Install server deps ───────────────────────────────────────────────
      - name: Install server dependencies
        run: npm ci

      # ── Run server tests (gate) ───────────────────────────────────────────
      - name: Run server tests
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: stub-key
          SUPABASE_ANON_KEY: stub-anon-key
          OPENAI_API_KEY: stub-openai-key

      # ── Run regression scripts (gate) ─────────────────────────────────────
      # Standalone pins referenced throughout CLAUDE.md's R-rules (R11, R23, ...)
      # that jest doesn't cover: CommandRegistry vocabulary collisions,
      # waveformPath.js's proxyUrl-shape handling, and the AI-command →
      # timeline-mutation pipeline. Pure logic / local-storage-mode checks —
      # no network or real credentials needed, verified to pass cleanly
      # standalone before being added here.
      - name: Run regression scripts
        run: npm run test:regression

      # ── Install + build client ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client (with source maps)
        run: npm run build
        working-directory: client
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── Apply Supabase migrations ─────────────────────────────────────────
      # Runs every migration file in migrations/ in filename order against
      # the target Supabase Postgres DB. All migrations are idempotent
      # (IF NOT EXISTS / CREATE OR REPLACE), so re-running is safe.
      #
      # Required GitHub secrets (set per environment in repo Settings):
      #   SUPABASE_DB_URL  — Postgres connection string, e.g.:
      #     postgresql://postgres:<password>@db.<ref>.supabase.co:5432/postgres
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f …"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # ── Deploy to Railway ─────────────────────────────────────────────────
      # Railway deploys are environment-scoped by the token you pass.
      # Create two tokens in Railway: one scoped to the staging environment,
      # one scoped to production, and store them as GitHub secrets:
      #   RAILWAY_TOKEN_STAGING
      #   RAILWAY_TOKEN_PRODUCTION
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to staging
        if: github.ref_name == 'staging'
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy to production
        if: github.ref_name == 'main'
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      # ── Create a Sentry release ───────────────────────────────────────────
      # Associates deployed commits with Sentry issues for better context.
      # Requires SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT secrets.
      - name: Create Sentry release
        if: ${{ env.SENTRY_AUTH_TOKEN_SET != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
