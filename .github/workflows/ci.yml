name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  # ── Lint & build the client ────────────────────────────────────────────────
  client:
    name: Client — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: as of 2026-07-29 there are ~300 pre-existing eslint
      # errors in the client (mostly no-unused-vars / no-undef in older
      # files). Making this a hard gate right now would fail on files
      # unrelated to whatever a given PR touches, with no way to merge until
      # all of them are cleaned up. Reported so the debt stays visible in
      # every run without blocking unrelated work — see CLAUDE.md NODE 9.
      # Could not verify this workflow's live pass/fail history from this
      # session (no gh CLI / GitHub API access here) — this change is based
      # on `npm run lint` failing locally against the current tree, not on
      # confirmed CI run logs.
      - name: Lint (report only)
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          # DSN is not needed for a build-only check; the plugin is skipped when absent.
          VITE_SENTRY_DSN: ''

  # ── Test the server ────────────────────────────────────────────────────────
  server:
    name: Server — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # ffmpeg-static's postinstall downloads the binary AND its README and
      # LICENSE from a GitHub release on every single install, and its error
      # handler tolerates only a 404:
      #
      #   const exitOnErrorOrWarnWith = (msg) => (err) => {
      #     if (err.statusCode === 404) console.warn(msg)
      #     else exitOnError(err)          // process.exit(1)
      #   }
      #
      # So a transient 5xx on linux-x64.LICENSE, a text file nothing runs,
      # fails the whole install. That is exactly what happened on 2026-11-05:
      # the binary downloaded fine and a 504 on the LICENSE killed the job.
      #
      # install.js exits 0 the moment it sees a binary already in place, and
      # FFMPEG_BIN is what it checks, so pointing it at the runner's own ffmpeg
      # means the release download never happens and cannot break anything.
      # CI only: production resolves ffmpeg-static the normal way, and the
      # server tests mock it through jest's moduleNameMapper regardless.
      - name: Use the runner's ffmpeg rather than downloading one
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          # Provide stub values so modules that import from .env don't throw.
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: stub-key
          SUPABASE_ANON_KEY: stub-anon-key
          OPENAI_API_KEY: stub-openai-key
